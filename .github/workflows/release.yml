name: Package macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build the signed app bundle and DMG
        run: Scripts/package-macos.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/AeryAir-macOS.dmg --generate-notes --title "Aery Air ${GITHUB_REF_NAME}"
